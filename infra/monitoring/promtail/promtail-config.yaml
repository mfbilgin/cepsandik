server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service_name
            request_id: request_id
            user_id: user_id
            event_type: event_type
            msg: message
            ts: timestamp

      # Hata ayıklama için seviyeyi etiket yapalım
      - labels:
          level:
          service:
          event_type:

      # Timestamp'i logun kendi içindeki zamana eşitleyelim (isteğe bağlı)
      - timestamp:
          source: ts
          format: RFC3339

      # Mesajın asıl içeriğini güzelleştirelim (Opsiyonel)
      - output:
          source: msg
