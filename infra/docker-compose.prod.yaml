version: "3.8"

services:
  gateway:
    image: ghcr.io/${GITHUB_OWNER}/cepsandik-gateway:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - community-service
      - election-service
    networks:
      - app-net
    mem_limit: 256m

  user-service:
    image: ghcr.io/${GITHUB_OWNER}/cepsandik-user-service:latest
    container_name: user-service
    restart: unless-stopped
    mem_limit: 450m
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx350m

      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/userdb
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}

      # Redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

      # RabbitMQ
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

      # Security Mapping
      - APP_JWT_SECRET=${JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - APP_JWT_ACCESS_TTL_SECONDS=${JWT_TTL_SECONDS}

      # Mail
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}

      # AWS S3 (Correct mapping for application.properties)
      - AWS_S3_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_S3_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_BUCKET}

      # Application Logic
      - APP_FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - app-net

  community-service:
    image: ghcr.io/${GITHUB_OWNER}/cepsandik-community-service:latest
    container_name: community-service
    restart: unless-stopped
    mem_limit: 400m
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx300m

      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/communitydb
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}

      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

      # Custom Properties
      - JWT_INTERNAL_SECRET=${INTERNAL_JWT_SECRET}
      - APP_INVITATION_LINK_BASE=${INVITATION_LINK_BASE}
    depends_on:
      - db
      - redis
    networks:
      - app-net

  election-service:
    image: ghcr.io/${GITHUB_OWNER}/cepsandik-election-service:latest
    container_name: election-service
    restart: unless-stopped
    mem_limit: 400m
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx300m

      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/electiondb
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}

      - JWT_INTERNAL_SECRET=${INTERNAL_JWT_SECRET}

      # RabbitMQ (Bildirim sistemi)
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

      # Community Service (internal communication)
      - APP_COMMUNITY_SERVICE_URL=http://community-service:8083
    depends_on:
      - db
      - rabbitmq
    networks:
      - app-net

  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - redis_data:/data
    networks:
      - app-net

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: rabbitmq
    restart: unless-stopped
    mem_limit: 256m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-net

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: backup
    restart: unless-stopped
    mem_limit: 128m
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      PGPASSWORD: ${DATABASE_PASSWORD}
      BACKUP_ON_START: "false"
    volumes:
      - backup_data:/backups
    depends_on:
      - db
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backup_data:
