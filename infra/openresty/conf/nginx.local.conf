env JWT_SECRET;
env INTERNAL_JWT_SECRET;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";
    lua_shared_dict rate_limit 10m;

    # Docker internal DNS resolver (Essential for 502 fixes on container rebuild)
    # NOTE: `upstream {}` blocks resolve DNS once at start-time and cache the IP
    # forever — `resolver valid=Ns` does NOT apply to upstream blocks. Below we
    # use variable-based proxy_pass so DNS is re-resolved per-request honoring
    # the resolver TTL.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /v1/auth {
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("auth")
            }
            set $user_upstream "user-service:8080";
            rewrite ^/v1/auth(.*)$ /api/v1/auth$1 break;
            proxy_pass http://$user_upstream;
        }

        location ^~ /v1/users/confirm-email-change {
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("auth")
            }
            set $user_upstream "user-service:8080";
            rewrite ^/v1/users/confirm-email-change(.*)$ /api/v1/users/confirm-email-change$1 break;
            proxy_pass http://$user_upstream;
        }

        location /v1/users {
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("protected")

                local jwt = require "resty.jwt"
                local cjson = require "cjson"

                local JWT_SECRET = os.getenv("JWT_SECRET") or "94010e81e0b61f9869c0232025086fbc83a2d60975231b86fa714a8a29b2a76d"
                local INTERNAL_SECRET = os.getenv("INTERNAL_JWT_SECRET") or "95d597309c7a8d06c95bab3136b53274e61dbbfcb1d1ca0fb9a24dff342d63ed"

                local auth_header = ngx.var.http_authorization
                if not auth_header then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Bu islem icin giris yapmaniz gerekmektedir."}))
                    return ngx.exit(401)
                end

                local token = auth_header:match("^Bearer%s+(.+)$")
                if not token then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Gecersiz kimlik bilgisi formati."}))
                    return ngx.exit(401)
                end

                local jwt_obj = jwt:verify(JWT_SECRET, token)
                if not jwt_obj.verified then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Oturum dogrulanamadi, lutfen tekrar giris yapin."}))
                    return ngx.exit(401)
                end

                local user_id = jwt_obj.payload.sub or jwt_obj.payload.userId or jwt_obj.payload.id
                local roles = jwt_obj.payload.roles or {"USER"}
                local platform_role = jwt_obj.payload.platformRole or "USER"

                if not user_id then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Oturum bilgisi eksik, lutfen tekrar giris yapin."}))
                    return ngx.exit(401)
                end

                local now = ngx.time()
                local internal_jwt = jwt:sign(INTERNAL_SECRET, {
                    header = {typ = "JWT", alg = "HS256"},
                    payload = {
                        uid = user_id,
                        roles = roles,
                        scope = {"community:read", "community:write"},
                        iss = "api-gateway",
                        iat = now,
                        exp = now + 30
                    }
                })

                ngx.req.set_header("X-Internal-Auth", internal_jwt)
                ngx.req.set_header("X-User-Id", tostring(user_id))
                ngx.req.set_header("X-Platform-Role", platform_role)
            }
            set $user_upstream "user-service:8080";
            rewrite ^/v1/users(.*)$ /api/v1/users$1 break;
            proxy_pass http://$user_upstream;
        }

        location /v1/communities {
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("protected")

                local jwt = require "resty.jwt"
                local cjson = require "cjson"

                local JWT_SECRET = os.getenv("JWT_SECRET") or "94010e81e0b61f9869c0232025086fbc83a2d60975231b86fa714a8a29b2a76d"
                local INTERNAL_SECRET = os.getenv("INTERNAL_JWT_SECRET") or "95d597309c7a8d06c95bab3136b53274e61dbbfcb1d1ca0fb9a24dff342d63ed"

                local auth_header = ngx.var.http_authorization
                local token = auth_header and auth_header:match("^Bearer%s+(.+)$")
                if not token then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Yetkisiz erisim."}))
                    return ngx.exit(401)
                end

                local jwt_obj = jwt:verify(JWT_SECRET, token)
                if not jwt_obj.verified then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Yetkisiz erisim."}))
                    return ngx.exit(401)
                end

                local user_id = jwt_obj.payload.sub or jwt_obj.payload.userId or jwt_obj.payload.id
                local roles = jwt_obj.payload.roles or {"USER"}
                local platform_role = jwt_obj.payload.platformRole or "USER"
                local now = ngx.time()
                local internal_jwt = jwt:sign(INTERNAL_SECRET, {
                    header = {typ = "JWT", alg = "HS256"},
                    payload = {
                        uid = user_id,
                        roles = roles,
                        scope = {"community:read", "community:write"},
                        iss = "api-gateway",
                        iat = now,
                        exp = now + 30
                    }
                })

                ngx.req.set_header("X-Internal-Auth", internal_jwt)
                ngx.req.set_header("X-User-Id", tostring(user_id))
                ngx.req.set_header("X-Platform-Role", platform_role)
            }
            set $community_upstream "community-service:8083";
            rewrite ^/v1/communities(.*)$ /api/v1/communities$1 break;
            proxy_pass http://$community_upstream;
        }

        location /v1/elections {
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("protected")

                local jwt = require "resty.jwt"
                local cjson = require "cjson"

                local JWT_SECRET = os.getenv("JWT_SECRET") or "94010e81e0b61f9869c0232025086fbc83a2d60975231b86fa714a8a29b2a76d"
                local INTERNAL_SECRET = os.getenv("INTERNAL_JWT_SECRET") or "95d597309c7a8d06c95bab3136b53274e61dbbfcb1d1ca0fb9a24dff342d63ed"

                local auth_header = ngx.var.http_authorization
                local token = auth_header and auth_header:match("^Bearer%s+(.+)$")
                if not token then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Yetkisiz erisim."}))
                    return ngx.exit(401)
                end

                local jwt_obj = jwt:verify(JWT_SECRET, token)
                if not jwt_obj.verified then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Yetkisiz erisim."}))
                    return ngx.exit(401)
                end

                local user_id = jwt_obj.payload.sub or jwt_obj.payload.userId or jwt_obj.payload.id
                local roles = jwt_obj.payload.roles or {"USER"}
                local platform_role = jwt_obj.payload.platformRole or "USER"
                local now = ngx.time()
                local internal_jwt = jwt:sign(INTERNAL_SECRET, {
                    header = {typ = "JWT", alg = "HS256"},
                    payload = {
                        uid = user_id,
                        roles = roles,
                        scope = {"election:read", "election:write"},
                        iss = "api-gateway",
                        iat = now,
                        exp = now + 30
                    }
                })

                ngx.req.set_header("X-Internal-Auth", internal_jwt)
                ngx.req.set_header("X-User-Id", tostring(user_id))
                ngx.req.set_header("X-Platform-Role", platform_role)
            }
            set $election_upstream "election-service:8082";
            rewrite ^/v1/elections(.*)$ /api/v1/elections$1 break;
            proxy_pass http://$election_upstream;
        }

        # Guardian (Emanetçi) endpoint'leri — GuardianController @ /api/v1/guardians.
        # Sprint 5.A.distributed: dağıtık key ceremony bu route üzerinden çalışır.
        # elections bloğunun birebir aynısı, sadece path rewrite farklı.
        location /v1/guardians {
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("protected")

                local jwt = require "resty.jwt"
                local cjson = require "cjson"

                local JWT_SECRET = os.getenv("JWT_SECRET") or "94010e81e0b61f9869c0232025086fbc83a2d60975231b86fa714a8a29b2a76d"
                local INTERNAL_SECRET = os.getenv("INTERNAL_JWT_SECRET") or "95d597309c7a8d06c95bab3136b53274e61dbbfcb1d1ca0fb9a24dff342d63ed"

                local auth_header = ngx.var.http_authorization
                local token = auth_header and auth_header:match("^Bearer%s+(.+)$")
                if not token then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Yetkisiz erisim."}))
                    return ngx.exit(401)
                end

                local jwt_obj = jwt:verify(JWT_SECRET, token)
                if not jwt_obj.verified then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Yetkisiz erisim."}))
                    return ngx.exit(401)
                end

                local user_id = jwt_obj.payload.sub or jwt_obj.payload.userId or jwt_obj.payload.id
                local roles = jwt_obj.payload.roles or {"USER"}
                local platform_role = jwt_obj.payload.platformRole or "USER"
                local now = ngx.time()
                local internal_jwt = jwt:sign(INTERNAL_SECRET, {
                    header = {typ = "JWT", alg = "HS256"},
                    payload = {
                        uid = user_id,
                        roles = roles,
                        scope = {"election:read", "election:write"},
                        iss = "api-gateway",
                        iat = now,
                        exp = now + 30
                    }
                })

                ngx.req.set_header("X-Internal-Auth", internal_jwt)
                ngx.req.set_header("X-User-Id", tostring(user_id))
                ngx.req.set_header("X-Platform-Role", platform_role)
            }
            set $guardian_upstream "election-service:8082";
            rewrite ^/v1/guardians(.*)$ /api/v1/guardians$1 break;
            proxy_pass http://$guardian_upstream;
        }

        location /user/actuator {
            set $user_upstream "user-service:8080";
            rewrite ^/user/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/user/actuator$ /actuator break;
            proxy_pass http://$user_upstream;
        }

        location /community/actuator {
            set $community_upstream "community-service:8083";
            rewrite ^/community/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/community/actuator$ /actuator break;
            proxy_pass http://$community_upstream;
        }

        location /election/actuator {
            set $election_upstream "election-service:8082";
            rewrite ^/election/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/election/actuator$ /actuator break;
            proxy_pass http://$election_upstream;
        }
    }
}
