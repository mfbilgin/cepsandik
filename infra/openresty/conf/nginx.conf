                ngx.req.set_header("X-Internal-Auth", internal_jwt)
                ngx.req.set_header("X-User-Id", tostring(user_id))
                ngx.req.set_header("X-Platform-Role", platform_role)
            }

            rewrite ^/v1/notifications(.*)$ /api/v1/notifications$1 break;
            proxy_pass http://notification_service;
        }

        # Actuator endpoints (Health checks - public, no rate limit)
        location /user/actuator {
            rewrite ^/user/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/user/actuator$ /actuator break;
            proxy_pass http://user_service;
        }

        # Community Service Health Check
        location /community/actuator {
            rewrite ^/community/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/community/actuator$ /actuator break;
            proxy_pass http://community_service;
        }

        # Election Service Health Check
        location /election/actuator {
            rewrite ^/election/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/election/actuator$ /actuator break;
            proxy_pass http://election_service;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

    # ============================================
    # Frontend - cepsandik.com
    # ============================================
    server {
        listen 443 ssl http2;
        server_name cepsandik.com www.cepsandik.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/cepsandik.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cepsandik.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Frontend root directory
        root /usr/share/nginx/html;
        index index.html;

        location ^~ /downloads/ {
            types {
                application/vnd.android.package-archive apk;
            }
            try_files $uri =404;
        }

        # Browser email verification link:
        # https://cepsandik.com/verify/{token}
        location ^~ /verify/ {
            rewrite ^/verify/(.*)$ /api/v1/auth/verify/$1 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user_service;
        }

        # SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Handle favicon.ico specifically to avoid logs
        location = /favicon.ico {
            return 204;
            access_log off;
            log_not_found off;
        }

        # Static assets (optional, for caching)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # error_page 404 /index.html;
    }
}
