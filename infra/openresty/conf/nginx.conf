            }
            
            proxy_pass http://election_service/api/v1/elections;
        }

        # Actuator endpoints (Health checks - public, no rate limit)
        location /user/actuator {
            rewrite ^/user/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/user/actuator$ /actuator break;
            proxy_pass http://user_service;
        }

        # Community Service Health Check
        location /community/actuator {
            rewrite ^/community/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/community/actuator$ /actuator break;
            proxy_pass http://community_service;
        }

        # Election Service Health Check
        location /election/actuator {
            rewrite ^/election/actuator/(.*)$ /actuator/$1 break;
            rewrite ^/election/actuator$ /actuator break;
            proxy_pass http://election_service;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

    # ============================================
    # Frontend - cepsandik.com
    # ============================================
    server {
        listen 443 ssl http2;
        server_name cepsandik.com www.cepsandik.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/cepsandik.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cepsandik.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Frontend root directory
        # Update this path when you deploy your frontend
        root /usr/share/nginx/html;
        index index.html;

        # SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Handle favicon.ico specifically to avoid logs
        location = /favicon.ico {
            return 204;
            access_log off;
            log_not_found off;
        }

        # =========================================================
        # Backend Page Proxies (For Mobile App Deep Linking Support)
        # =========================================================
        
        # Email Verification Page (Thymeleaf rendered by backend)
        location /auth/verify/ {
            proxy_pass http://user_service/api/v1/auth/verify/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Email Change Confirmation (Direct API call)
        location /users/confirm-email-change/ {
            proxy_pass http://user_service/api/v1/users/confirm-email-change/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static assets (optional, for caching)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # error_page 404 /index.html;
    }
}
