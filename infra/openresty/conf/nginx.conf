# Expose environment variables to Lua
env JWT_SECRET;
env INTERNAL_JWT_SECRET;
# Faz 3.11 — rate-limit override (set edilmezse prod-makul default: 15/100/60)
env RL_AUTH;
env RL_PROTECTED;
env RL_DEFAULT;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Lua package path
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # Rate limiting shared memory (10MB)
    lua_shared_dict rate_limit 10m;

    # Structured JSON Log Format
    log_format json_analytics escape=json '{'
        '"timestamp": "$time_iso8601", '
        '"remote_addr": "$remote_addr", '
        '"request_id": "$correlation_id", '
        '"request_method": "$request_method", '
        '"request_uri": "$request_uri", '
        '"status": $status, '
        '"request_time": $request_time, '
        '"body_bytes_sent": $body_bytes_sent, '
        '"http_referrer": "$http_referer", '
        '"http_user_agent": "$http_user_agent", '
        '"app_version": "$http_x_app_version", '
        '"platform": "$http_x_platform", '
        '"device_id": "$http_x_device_id"'
    '}';

    access_log  /usr/local/openresty/nginx/logs/access.log  json_analytics;

    # Map to handle Correlation ID: Use client-provided ID or fallback to Nginx request_id
    map $http_x_correlation_id $correlation_id {
        default   $request_id;
        "~.+"     $http_x_correlation_id;
    }

    # Upstream services
    upstream user_service {
        server user-service:8080;
    }

    upstream community_service {
        server community-service:8083;
    }

    upstream election_service {
        server election-service:8082;
    }

    upstream notification_service {
        server notification-service:8084;
    }

    # ============================================
    # HTTP to HTTPS Redirect
    # ============================================
    server {
        listen 80;
        server_name api.cepsandik.com cepsandik.com www.cepsandik.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # Handle favicon.ico specifically to avoid logs
        location = /favicon.ico {
            return 204;
            access_log off;
            log_not_found off;
        }
    }

    # ============================================
    # API Gateway - api.cepsandik.com
    # ============================================
    server {
        listen 443 ssl http2;
        server_name api.cepsandik.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/api.cepsandik.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.cepsandik.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Allow larger file uploads (10MB for profile images)
        client_max_body_size 10M;

        # Global proxy settings
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Distributed Request Context Headers
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_set_header X-App-Version $http_x_app_version;
        proxy_set_header X-Platform $http_x_platform;
        proxy_set_header X-Device-ID $http_x_device_id;

        # ========================================
        # PUBLIC ENDPOINTS - NO AUTH REQUIRED
        # ========================================
        
        # Auth endpoints (login, register, etc.)
        location /v1/auth {
            # Rate limit: 10 req/min (brute-force protection)
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("auth")
            }
            
            proxy_pass http://user_service/api/v1/auth;
        }

        # Email change confirmation (public - accessed via email link)
        location ^~ /v1/users/confirm-email-change {
            # No auth required - just rate limit
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("auth")
            }
            
            proxy_pass http://user_service/api/v1/users/confirm-email-change;
        }

        # ========================================
        # PROTECTED ENDPOINTS - JWT REQUIRED
        # ========================================

        # User Service - Protected
        location /v1/users {
            # Rate limit + JWT auth combined
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                rate_limit.check("protected")
                
                -- JWT auth inline (from jwt_auth.lua)
                local jwt = require "resty.jwt"
                local cjson = require "cjson"
                
                local JWT_SECRET = os.getenv("JWT_SECRET") or (ngx.log(ngx.ERR, "FATAL: JWT_SECRET env tanimsiz - istek reddedildi") or ngx.exit(500))
                local INTERNAL_SECRET = os.getenv("INTERNAL_JWT_SECRET") or (ngx.log(ngx.ERR, "FATAL: INTERNAL_JWT_SECRET env tanimsiz - istek reddedildi") or ngx.exit(500))
                
                local auth_header = ngx.var.http_authorization
                if not auth_header then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Bu işlem için giriş yapmanız gerekmektedir."}))
                    return ngx.exit(401)
                end
                
                local token = auth_header:match("^Bearer%s+(.+)$")
                if not token then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Geçersiz kimlik bilgisi formatı."}))
                    return ngx.exit(401)
                end
                
                local jwt_obj = jwt:verify(JWT_SECRET, token)
                if not jwt_obj.verified then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    -- Check if expired
                    if jwt_obj.reason and string.find(jwt_obj.reason, "exp") then
                        ngx.say(cjson.encode({success = false, message = "Oturumunuz sonlandı, lütfen tekrar giriş yapın."}))
                    else
                        ngx.say(cjson.encode({success = false, message = "Oturum doğrulanamadı, lütfen tekrar giriş yapın."}))
                    end
                    return ngx.exit(401)
                end
                
                -- Double check expiration (belt and suspenders)
                local now = ngx.time()
                if jwt_obj.payload.exp and jwt_obj.payload.exp < now then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Oturumunuz sonlandı, lütfen tekrar giriş yapın."}))
                    return ngx.exit(401)
                end
                
                local user_id = jwt_obj.payload.sub or jwt_obj.payload.userId or jwt_obj.payload.id
                local roles = jwt_obj.payload.roles or {"USER"}
                local platform_role = jwt_obj.payload.platformRole or "USER"
                
                if not user_id then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({success = false, message = "Oturum bilgisi eksik, lütfen tekrar giriş yapın."}))
                    return ngx.exit(401)
                end
                
                -- Generate internal token
                local internal_jwt = jwt:sign(INTERNAL_SECRET, {
                    header = {typ = "JWT", alg = "HS256"},
                    payload = {
                        uid = user_id,
                        roles = roles,
                        scope = {"community:read", "community:write"},
                        iss = "api-gateway",
                        iat = now,
                        exp = now + 30
                    }
                })
                
                ngx.req.set_header("X-Internal-Auth", internal_jwt)
                ngx.req.set_header("X-User-Id", tostring(user_id))
                ngx.req.set_header("X-Platform-Role", platform_role)
            }
            
            proxy_pass http://user_service/api/v1/users;
        }

