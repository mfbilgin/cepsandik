name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cepsandik

jobs:
  # ===== Job 1: Build & push images to GHCR =====
  build:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway
            context: ./infra/openresty
          - name: user-service
            context: ./backend/user-service
          - name: community-service
            context: ./backend/community-service
          - name: election-service
            context: ./backend/election-service
          - name: bulletin-board-service
            context: ./backend/bulletin-board-service
          - name: notification-service
            context: ./backend/notification-service
          - name: crypto-engine-kotlin
            context: ./backend/crypto-engine-kotlin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ===== Job 2: Deploy to DigitalOcean Droplet =====
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          timeout: 10m
          command_timeout: 15m
          envs: CR_PAT,GITHUB_OWNER
          script: |
            set -e

            echo "📥 Updating codebase..."
            cd /opt/cepsandik
            git fetch origin main
            git reset --hard origin/main
            rm -rf mobile/

            echo "🔐 Logging in to GHCR..."
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_OWNER" --password-stdin

            cd infra
            mkdir -p certbot/conf certbot/www logs/nginx openresty/html/downloads

            export GITHUB_OWNER="$GITHUB_OWNER"

            echo "⬇️  Pulling images..."
            docker compose -f docker-compose.prod.yaml pull

            echo "🚀 Bringing up stack..."
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans

            echo "🧹 Pruning old images..."
            docker system prune -f

            echo "⏳ Waiting for services to settle..."
            sleep 20

            echo "🩺 Health check..."
            docker compose -f docker-compose.prod.yaml ps
            if curl -sfo /dev/null https://api.cepsandik.com/user/actuator/health; then
              echo "✅ user-service healthy"
            else
              echo "⚠️  user-service health endpoint not reachable (could be SSL not yet configured)"
            fi

            echo "✅ Deployment completed!"
