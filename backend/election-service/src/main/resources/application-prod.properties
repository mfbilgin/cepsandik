# Production Configuration
spring.application.name=election-service
server.port=8082

# Database (PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (Internal communication - from API Gateway)
jwt.internal.secret=${INTERNAL_JWT_SECRET}

# Access Code Configuration
app.access-code.length=6
app.access-code.characters=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.com.cepsandik=INFO
logging.level.org.springframework.security=WARN
