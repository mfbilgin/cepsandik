spring.application.name=election-service
server.port=8082

# Database configuration from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (Internal communication)
jwt.internal.secret=${JWT_INTERNAL_SECRET}

# Access Code Configuration
app.access-code.length=6
app.access-code.characters=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

# RabbitMQ (Bildirim Sistemi)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Community Service (internal communication)
app.community-service.url=${APP_COMMUNITY_SERVICE_URL}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Faz 3.13 — Prod logging: DEBUG KAPALI. Default application.properties
# com.cepsandik.electionservice=DEBUG + org.springframework.security=DEBUG
# tanimlar; prod override etmezse InternalJwtFilter DEBUG loglari (token
# varligi, URI, userId) prod'da basilir → INFO/WARN'a cek.
logging.level.root=INFO
logging.level.com.cepsandik.electionservice=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
