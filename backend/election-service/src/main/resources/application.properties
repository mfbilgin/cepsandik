# ==========================================
# Election Service Configuration
# ==========================================

spring.application.name=election-service
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/electiondb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (Internal communication - from API Gateway)
jwt.internal.secret=${INTERNAL_JWT_SECRET:your-internal-jwt-secret-key-for-service-to-service-communication}

# Access Code Configuration
app.access-code.length=6
app.access-code.characters=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.cepsandik.electionservice=DEBUG
logging.level.org.springframework.security=DEBUG
