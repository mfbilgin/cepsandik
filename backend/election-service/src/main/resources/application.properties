# ==========================================
# Election Service Configuration
# ==========================================

spring.application.name=election-service
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/electiondb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (Internal communication - from API Gateway)
jwt.internal.secret=${INTERNAL_JWT_SECRET:your-internal-jwt-secret-key-for-service-to-service-communication}

# Access Code Configuration
app.access-code.length=6
app.access-code.characters=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.cepsandik.electionservice=DEBUG
logging.level.org.springframework.security=DEBUG

# RabbitMQ (Bildirim Sistemi)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Community Service (internal communication)
app.community-service.url=${APP_COMMUNITY_SERVICE_URL:http://community-service:8083}
# User Service (internal communication) — user-service 8080'de çalışır;
# UserServiceClient @Value default'u 8081 (yanlış) idi, bu property yoktu.
app.user-service.url=${APP_USER_SERVICE_URL:http://user-service:8080}

# Crypto-Engine (gRPC — kriptografik işlemler)
app.crypto-engine.host=${APP_CRYPTO_ENGINE_HOST:localhost}
app.crypto-engine.port=${APP_CRYPTO_ENGINE_PORT:50051}

# ElectionGuard Guardian Konfigürasyonu
app.guardian.count=${APP_GUARDIAN_COUNT:3}
app.guardian.quorum=${APP_GUARDIAN_QUORUM:2}
