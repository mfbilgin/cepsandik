syntax = "proto3";

package cepsandik.crypto;

option java_multiple_files = true;
option java_package = "com.cepsandik.electionservice.grpc";
option java_outer_classname = "CryptoProto";

service CryptoService {
  // Seçim için ElectionGuard key ceremony yapar (Simüle/Test amaçlı hala duruyor)
  rpc SetupElection (SetupElectionRequest) returns (SetupElectionResponse);

  // Mobile'dan gelen client-side şifreli ballot'u doğrular (E2E-V)
  rpc ValidateBallot (ValidateBallotRequest) returns (ValidateBallotResponse);

  // Seçim sonunda threshold decryption ile tally çözer
  rpc TallyElection (TallyElectionRequest) returns (TallyElectionResponse);

  // Dağıtık: Kamu anahtarlarını birleştirip joint key + context üretir
  rpc CreateJointKey (CreateJointKeyRequest) returns (CreateJointKeyResponse);

  // === Gerçek E2E-V Threshold Decryption (3-round) ===
  // Sprint 5.C.2 — stateful session, server private state görmez.
  // DecryptorDoerre'i orchestrate eder; her round'da mobile cihazlar
  // local KMP DecryptingTrusteeDoerre ile partial/response üretir.

  // Round 0: Session başlat. Server EncryptedTally hesaplar, perTrustee A list
  //          (= encryptedTallyJson içinden mobile'ın çıkaracağı pad bileşenleri)
  //          ile session_id döner. DecryptorDoerre arka planda başlatılır,
  //          her trustee proxy'si decrypt() çağrısında BLOCK olur.
  rpc StartTallyDecryptionSession (StartTallyDecryptionSessionRequest) returns (StartTallyDecryptionSessionResponse);

  // Round 1: Mobile guardian lokal decrypt sonucunu submit eder.
  //          Sunucu BlockingQueue'ye yazar, ilgili proxy'nin decrypt()
  //          çağrısı unblocks. Quorum tamamlandığında server otomatik Fiat-Shamir
  //          hash hesaplar, challenge'ları proxy queue'lerine yerleştirir.
  rpc SubmitPartialDecryption (SubmitPartialDecryptionRequest) returns (SessionAckResponse);

  // Round 2: Mobile guardian challenge'larını pull eder (long-poll).
  //          Henüz hazır değilse BLOCK eder (~deadline'a kadar).
  rpc GetChallenges (GetChallengesRequest) returns (GetChallengesResponse);

  // Round 3: Mobile guardian challenge response'unu submit eder.
  //          Quorum'da DecryptorDoerre tamamlanır, session FINAL durumuna geçer.
  rpc SubmitChallengeResponse (SubmitChallengeResponseRequest) returns (SessionAckResponse);

  // Final: Tally sonucu + proof'u pull et. Henüz hazır değilse BLOCK eder.
  rpc FinalizeTallyDecryption (FinalizeTallyDecryptionRequest) returns (TallyElectionResponse);

  // [DEPRECATED, Sprint 6'da silinecek] Legacy tek-shot RPC; gerçek E2E-V
  // sağlamaz — mobile'ın private key share'ini sunucuya yollamasını gerektirir.
  // Yerine yukarıdaki 5-stage akışı kullan.
  rpc DecryptWithShares (DecryptWithSharesRequest) returns (TallyElectionResponse);

  // Faz 1.4 — Benaloh challenge (cast-as-intended). Cihaz spoil edilen
  // ballot'un primary nonce'ını açar; sunucu DecryptWithNonce ile ciphertext'i
  // BAĞIMSIZ çözer (trustless — cihaza güvenmez). Çözülen seçim cihazın
  // iddiasıyla eşleşirse cihaz dürüst şifrelemiş demektir. Spoiled ballot
  // ASLA tally'ye girmez.
  rpc VerifySpoiledBallot (VerifySpoiledBallotRequest) returns (VerifySpoiledBallotResponse);
}

// ==================== Setup ====================

message SetupElectionRequest {
  string election_id = 1;
  int32 number_of_guardians = 2;     // N (toplam mütevelli sayısı)
  int32 quorum = 3;                  // Q (eşik değer, Q <= N)
  repeated ContestInfo contests = 4;
  string start_date = 5;             // ISO format (YYYY-MM-DDTHH:MM:SSZ)
  string end_date = 6;               // ISO format
}

message ContestInfo {
  string contest_id = 1;
  repeated string selection_ids = 2; // aday/seçenek ID'leri
  int32 number_elected = 3;          // max seçilebilecek
  string name = 4;                   // yarışma/seçenek adı
}

message SetupElectionResponse {
  string election_guard_context = 1;           // CiphertextElectionContext (JSON)
  string joint_public_key = 2;                 // ElGamal joint key
  string election_manifest = 3;               // InternalManifest (JSON)
  repeated GuardianRecord guardian_records = 4;
}

message GuardianRecord {
  string guardian_id = 1;
  string serialized_guardian = 2;              // Guardian state (JSON)
}

// ==================== Validate (client-side encrypted ballot) ====================

message ValidateBallotRequest {
  string election_id = 1;
  string election_guard_context = 2;
  string election_manifest = 3;
  string ballot_id = 4;
  string ciphertext_ballot = 5;
  string zkp_proof = 6;
  string tracking_code = 7;
  string ballot_hash = 8;
}

message ValidateBallotResponse {
  bool valid = 1;
  string ballot_hash = 2;
  string tracking_code = 3;
  string error = 4;
}

// ==================== Tally ====================

message TallyElectionRequest {
  string election_id = 1;
  string election_guard_context = 2;
  string election_manifest = 3;
  repeated string ciphertext_ballots = 4;              // tüm şifreli oylar (JSON)
  repeated GuardianRecord guardian_records = 5;         // eşik çözüm için
  int32 quorum = 6;
}

message TallyElectionResponse {
  repeated ContestResult results = 1;
  string tally_proof = 2;                     // toplam kanıt (JSON)
}

message ContestResult {
  string contest_id = 1;
  repeated SelectionResult selections = 2;
}

message SelectionResult {
  string selection_id = 1;
  int64 tally = 2;
}

// ==================== Distributed Logic ====================

message CreateJointKeyRequest {
  string election_id = 1;
  int32 number_of_guardians = 2;
  int32 quorum = 3;
  repeated GuardianPublicKey public_keys = 4;
  repeated ContestInfo contests = 5;
  string start_date = 6;             // ISO format
  string end_date = 7;               // ISO format
}

message GuardianPublicKey {
  string guardian_id = 1;
  string public_key = 2;       // ElementModP (hex)
  string commitments = 3;      // JSON array
  string coefficient_proofs = 4; // JSON (Schnorr proofs of knowledge)
}

message CreateJointKeyResponse {
  string election_guard_context = 1;
  string joint_public_key = 2;
  string election_manifest = 3;
}

message DecryptWithSharesRequest {
  string election_id = 1;
  string election_guard_context = 2;
  string election_manifest = 3;
  repeated string ciphertext_ballots = 4;
  repeated DecryptionShare shares = 5;
}

message DecryptionShare {
  string guardian_id = 1;
  string share_data = 2;    // JSON (ElectionGuard partial decryption)
}

// ==================== Sprint 5.C.2 — 3-round Threshold Decryption ====================

message StartTallyDecryptionSessionRequest {
  string election_id = 1;
  string election_guard_context = 2;     // composite { init, config }
  string election_manifest = 3;
  repeated string ciphertext_ballots = 4;
  // Bu session'a hangi guardian'lar katılıyor (quorum >= en az Q kişi).
  // Sıralama önemli — DecryptorDoerre Lagrange interpolation için kullanır.
  repeated string participating_guardian_ids = 5;
}

message StartTallyDecryptionSessionResponse {
  string session_id = 1;
  // EncryptedTally JSON — mobile guardian lokal extract eder, lokal
  // DecryptingTrusteeDoerre.decrypt(group, listOfA)'yı çağırır.
  string encrypted_tally_json = 2;
}

message SubmitPartialDecryptionRequest {
  string session_id = 1;
  string guardian_id = 2;
  // KMP `List<PartialDecryption>` JSON — mobile lokal hesaplar.
  string partial_decryptions_json = 3;
}

message SubmitChallengeResponseRequest {
  string session_id = 1;
  string guardian_id = 2;
  // KMP `List<ChallengeResponse>` JSON — mobile lokal hesaplar.
  string challenge_responses_json = 3;
}

message GetChallengesRequest {
  string session_id = 1;
  string guardian_id = 2;
}

message GetChallengesResponse {
  // KMP `List<ChallengeRequest>` JSON — mobile lokal challenge() çağrısına verir.
  string challenges_json = 1;
}

message FinalizeTallyDecryptionRequest {
  string session_id = 1;
}

message SessionAckResponse {
  bool accepted = 1;
  string state = 2;   // örn. WAIT_PARTIAL, WAIT_CHALLENGE_RESPONSE, FINAL
  string error = 3;
}

// ==================== Faz 1.4 — Benaloh challenge / spoil ====================

message VerifySpoiledBallotRequest {
  string election_id = 1;
  string encrypted_ballot_json = 2;       // spoil edilen EncryptedBallot (KMP JSON)
  string primary_nonce_hex = 3;           // cihazın açtığı ballot primary nonce
  string election_guard_context = 4;      // composite init+config
  string election_manifest = 5;
  // Cihazın açtığı PlaintextBallot (KMP PlaintextBallotJson). Spoiled ballot
  // zaten sayılmaz, plaintext ifşası tasarımın amacıdır. Sunucu bunu nonce ile
  // YENİDEN şifreler; ciphertext submit edilenle birebir eşleşirse cihaz
  // dürüst şifrelemiştir (re-encryption ile trustless doğrulama).
  string plaintext_ballot_json = 6;
}

message SpoiledSelection {
  string selection_id = 1;
  int64 vote = 2;                         // nonce ile çözülen plaintext (0/1)
}

message VerifySpoiledBallotResponse {
  bool verified = 1;                      // ciphertext nonce ile tutarlı mı (trustless)
  repeated SpoiledSelection selections = 2;
  string error = 3;
}
