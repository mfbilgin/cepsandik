spring.application.name=user-service

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.driver-class-name=org.postgresql.Driver

# Database (Mapped automatically from SPRING_DATASOURCE_URL etc. but explicit is clearer)
# spring.datasource.url=${SPRING_DATASOURCE_URL}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-ttl-seconds=${APP_JWT_ACCESS_TTL_SECONDS:900}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true

# App Info
info.app.name=Cep Sandik User Service
info.app.description=Kullanici Kimlik ve Oturum Y\u00F6netimi Servisi
info.app.version=1.0.0

# Frontend URL
app.frontend.url=${APP_FRONTEND_URL}

# Mail Configuration (Explicit mapping from custom ENV vars)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp

# Google Play Integrity (cihaz bütünlüğü)
app.integrity.enabled=${PLAY_INTEGRITY_ENABLED:false}
app.integrity.package-name=${PLAY_INTEGRITY_PACKAGE_NAME:com.cepsandik.mobile}
app.integrity.require-play-recognized=${PLAY_INTEGRITY_REQUIRE_PLAY_RECOGNIZED:true}
app.integrity.service-account-json-base64=${PLAY_INTEGRITY_SA_JSON_BASE64:}
