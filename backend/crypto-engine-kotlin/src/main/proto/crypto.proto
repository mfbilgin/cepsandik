syntax = "proto3";

package cepsandik.crypto;

option java_multiple_files = true;
option java_package = "com.cepsandik.electionservice.grpc";
option java_outer_classname = "CryptoProto";

service CryptoService {
  // Seçim için ElectionGuard key ceremony yapar (Simüle/Test amaçlı hala duruyor)
  rpc SetupElection (SetupElectionRequest) returns (SetupElectionResponse);

  // Mobile'dan gelen client-side şifreli ballot'u doğrular (E2E-V)
  rpc ValidateBallot (ValidateBallotRequest) returns (ValidateBallotResponse);

  // Seçim sonunda threshold decryption ile tally çözer
  rpc TallyElection (TallyElectionRequest) returns (TallyElectionResponse);

  // Dağıtık: Kamu anahtarlarını birleştirip joint key + context üretir
  rpc CreateJointKey (CreateJointKeyRequest) returns (CreateJointKeyResponse);

  // Dağıtık: Deşifre paylarını toplayıp sonucu açıklar
  rpc DecryptWithShares (DecryptWithSharesRequest) returns (TallyElectionResponse);
}

// ==================== Setup ====================

message SetupElectionRequest {
  string election_id = 1;
  int32 number_of_guardians = 2;     // N (toplam mütevelli sayısı)
  int32 quorum = 3;                  // Q (eşik değer, Q <= N)
  repeated ContestInfo contests = 4;
  string start_date = 5;             // ISO format (YYYY-MM-DDTHH:MM:SSZ)
  string end_date = 6;               // ISO format
}

message ContestInfo {
  string contest_id = 1;
  repeated string selection_ids = 2; // aday/seçenek ID'leri
  int32 number_elected = 3;          // max seçilebilecek
  string name = 4;                   // yarışma/seçenek adı
}

message SetupElectionResponse {
  string election_guard_context = 1;           // CiphertextElectionContext (JSON)
  string joint_public_key = 2;                 // ElGamal joint key
  string election_manifest = 3;               // InternalManifest (JSON)
  repeated GuardianRecord guardian_records = 4;
}

message GuardianRecord {
  string guardian_id = 1;
  string serialized_guardian = 2;              // Guardian state (JSON)
}

// ==================== Validate (client-side encrypted ballot) ====================

message ValidateBallotRequest {
  string election_id = 1;
  string election_guard_context = 2;
  string election_manifest = 3;
  string ballot_id = 4;
  string ciphertext_ballot = 5;
  string zkp_proof = 6;
  string tracking_code = 7;
  string ballot_hash = 8;
}

message ValidateBallotResponse {
  bool valid = 1;
  string ballot_hash = 2;
  string tracking_code = 3;
  string error = 4;
}

// ==================== Tally ====================

message TallyElectionRequest {
  string election_id = 1;
  string election_guard_context = 2;
  string election_manifest = 3;
  repeated string ciphertext_ballots = 4;              // tüm şifreli oylar (JSON)
  repeated GuardianRecord guardian_records = 5;         // eşik çözüm için
  int32 quorum = 6;
}

message TallyElectionResponse {
  repeated ContestResult results = 1;
  string tally_proof = 2;                     // toplam kanıt (JSON)
}

message ContestResult {
  string contest_id = 1;
  repeated SelectionResult selections = 2;
}

message SelectionResult {
  string selection_id = 1;
  int64 tally = 2;
}

// ==================== Distributed Logic ====================

message CreateJointKeyRequest {
  string election_id = 1;
  int32 number_of_guardians = 2;
  int32 quorum = 3;
  repeated GuardianPublicKey public_keys = 4;
  repeated ContestInfo contests = 5;
  string start_date = 6;             // ISO format
  string end_date = 7;               // ISO format
}

message GuardianPublicKey {
  string guardian_id = 1;
  string public_key = 2;       // ElementModP (hex)
  string commitments = 3;      // JSON array
  string coefficient_proofs = 4; // JSON (Schnorr proofs of knowledge)
}

message CreateJointKeyResponse {
  string election_guard_context = 1;
  string joint_public_key = 2;
  string election_manifest = 3;
}

message DecryptWithSharesRequest {
  string election_id = 1;
  string election_guard_context = 2;
  string election_manifest = 3;
  repeated string ciphertext_ballots = 4;
  repeated DecryptionShare shares = 5;
}

message DecryptionShare {
  string guardian_id = 1;
  string share_data = 2;    // JSON (ElectionGuard partial decryption)
}
