spring.application.name=community-service
server.port=8083

# Database configuration from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# Internal JWT
jwt.internal.secret=${JWT_INTERNAL_SECRET}

# Invitation Link
app.invitation.link-base=${APP_INVITATION_LINK_BASE}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
# Faz 3.13 — prod'da health detaylarini yetkisize acma (always → when-authorized)
management.endpoint.health.show-details=when-authorized

# Faz 3.13 — Prod logging: default application.properties DEBUG'i override et.
logging.level.root=INFO
logging.level.com.cepsandik.communityservice=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
